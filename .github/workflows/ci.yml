name: CI

on:
  pull_request:
    branches: [stag, main]
  push:
    branches: [dev]

# Build-only for now: lint would just auto-fix ~1000 pending prettier issues rather than
# gate anything meaningful, and there are no real tests yet. Add `npm run lint` / `npm test`
# here once the codebase is formatted and tests exist.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [euro-auth, euro-platform-api, euro-platform-front]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run build
