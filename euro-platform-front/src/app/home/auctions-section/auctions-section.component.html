<section>
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex flex-wrap items-center gap-3">
      <h2 class="text-2xl font-bold text-white">{{ 'auctions.heading' | translate }}</h2>
      <p-select [options]="yearOptions()" [placeholder]="yearOptions()[0]" [size]="'small'" />
      <p-select [options]="transmissionOptions()" [placeholder]="transmissionOptions()[0]" [size]="'small'" />
      <p-select [options]="bodyStyleOptions()" [placeholder]="bodyStyleOptions()[0]" [size]="'small'" />
    </div>

    <div class="flex flex-wrap items-center gap-4 text-sm">
      @for (tab of sortTabs; track tab.key) {
        <button
          type="button"
          (click)="selectSort(tab.key)"
          class="font-medium"
          [class.text-primary]="activeSort() === tab.key"
          [class.underline]="activeSort() === tab.key"
          [class.text-surface-300]="activeSort() !== tab.key"
        >
          {{ tab.labelKey | translate }}
        </button>
      }
    </div>
  </div>

  <div class="mt-6 grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-4">
    @for (auction of auctions(); track auction.id) {
      <app-auction-card [data]="auction" />
    }
  </div>
</section>
