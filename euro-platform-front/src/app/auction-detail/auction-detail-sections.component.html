<div class="divide-y divide-surface-600 bg-surface-700 p-4">
  @for (section of sections(); track section.headingKey) {
    <div class="py-4 first:pt-0 last:pb-0">
      <h2 class="text-lg font-bold text-white">{{ section.headingKey | translate }}</h2>
      @if (section.paragraphs) {
        <div class="mt-3 space-y-2 text-sm text-surface-200">
          @for (paragraph of section.paragraphs; track paragraph) {
            <p>{{ paragraph }}</p>
          }
        </div>
      }
      @if (section.items) {
        <ul class="mt-3 list-disc space-y-1 pl-5 text-sm text-surface-200">
          @for (item of section.items; track item) {
            <li>{{ item }}</li>
          }
        </ul>
      }
    </div>
  }
</div>
