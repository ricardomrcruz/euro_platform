<div class="bg-surface-700 p-4">
  <h2 class="text-lg font-bold text-white">{{ 'auctionDetail.bidHistory.heading' | translate }}</h2>

  @if (bids().length > 0) {
    <div class="mt-3 divide-y divide-surface-600 text-sm">
      @for (bid of bids(); track bid.id) {
        <div class="flex items-center justify-between py-2">
          <span class="font-medium text-white">{{ bid.bidderName }}</span>
          <span class="font-semibold text-white">{{ bid.amount | currency: 'EUR' : 'symbol' : '1.0-0' }}</span>
          <span class="text-xs text-surface-300">{{ bid.timestamp | date: 'short' }}</span>
        </div>
      }
    </div>
  } @else {
    <p class="mt-3 text-sm text-surface-300">{{ 'auctionDetail.bidHistory.noBids' | translate }}</p>
  }
</div>
