@if (videos().length > 0) {
  <div class="bg-surface-700 p-4">
    <h2 class="text-lg font-bold text-white">{{ 'auctionDetail.video.heading' | translate }}</h2>
    <div class="mt-3 grid grid-cols-1 gap-4 sm:grid-cols-2">
      @for (video of videos(); track video.caption) {
        <div>
          <div class="relative aspect-video cursor-pointer overflow-hidden bg-surface-200">
            <img [src]="video.thumbnailUrl" alt="" class="h-full w-full object-cover" />
            <div class="absolute inset-0 flex items-center justify-center bg-surface-900/30">
              <i class="pi pi-play-circle text-4xl text-white"></i>
            </div>
          </div>
          <p class="mt-2 text-sm font-medium text-surface-200">{{ video.caption }}</p>
        </div>
      }
    </div>
  </div>
}
