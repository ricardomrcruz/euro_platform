<div class="grid grid-cols-1 gap-2 lg:grid-cols-6">
  <div class="col-span-4 overflow-hidden bg-surface-200">
    <img [src]="mainPhotoUrl()" [alt]="title()" class="h-full w-full object-cover" />
  </div>

  <div class="col-span-2 grid grid-cols-2 gap-2">
    @for (photo of thumbnailUrls(); track photo) {
      <div class="aspect-[3/2] overflow-hidden bg-surface-200">
        <img [src]="photo" alt="" class="h-full w-full object-cover" />
      </div>
    }

    <button
      type="button"
      (click)="openGallery()"
      class="relative aspect-[3/2] overflow-hidden bg-surface-200 text-left"
    >
      <img
        [src]="thumbnailUrls()[thumbnailUrls().length - 1]"
        alt=""
        class="h-full w-full object-cover blur-sm"
      />
      <div class="absolute inset-0 flex items-center justify-center bg-surface-900/60">
        <span class="px-2 text-center text-sm font-semibold text-white">
          {{ 'auctionDetail.gallery.seeAllPhotos' | translate: { count: totalPhotoCount() } }}
        </span>
      </div>
    </button>
  </div>
</div>
