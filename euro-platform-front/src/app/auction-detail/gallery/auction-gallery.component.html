<div class="grid grid-cols-1 gap-2 lg:grid-cols-6">
  <button
    type="button"
    (click)="openAt(mainPhotoUrl())"
    class="col-span-4 overflow-hidden bg-surface-200 text-left"
  >
    <img [src]="mainPhotoUrl()" [alt]="title()" class="h-full w-full object-cover" />
  </button>

  <div class="col-span-2 grid grid-cols-2 gap-2">
    @for (photo of thumbnailUrls(); track photo) {
      <button
        type="button"
        (click)="openAt(photo)"
        class="aspect-[3/2] overflow-hidden bg-surface-200 text-left"
      >
        <img [src]="photo" alt="" class="h-full w-full object-cover" />
      </button>
    }

    <button
      type="button"
      (click)="openAll()"
      class="relative aspect-[3/2] overflow-hidden bg-surface-200 text-left"
    >
      <img
        [src]="thumbnailUrls()[thumbnailUrls().length - 1]"
        alt=""
        class="h-full w-full object-cover blur-sm"
      />
      <div class="absolute inset-0 flex items-center justify-center bg-surface-900/60">
        <span class="px-2 text-center text-sm font-semibold text-white">
          {{ 'auctionDetail.gallery.seeAllPhotos' | translate: { count: totalPhotoCount() } }}
        </span>
      </div>
    </button>
  </div>
</div>

@if (lightboxIndex() !== null) {
  @let index = lightboxIndex()!;
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-surface-950/90 p-4"
    (click)="closeLightbox()"
  >
    <button
      type="button"
      (click)="closeLightbox()"
      class="absolute right-4 top-4 text-2xl leading-none text-surface-300 hover:text-white"
      aria-label="Close"
    >
      &times;
    </button>

    <div class="absolute left-4 top-4 text-sm text-surface-300">
      {{ index + 1 }} / {{ photoUrls().length }}
    </div>

    @if (photoUrls().length > 1) {
      <button
        type="button"
        (click)="prev(); $event.stopPropagation()"
        class="absolute left-2 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full bg-surface-900/60 text-xl text-white hover:bg-surface-900/80 sm:left-6"
        aria-label="Previous photo"
      >
        &lsaquo;
      </button>
      <button
        type="button"
        (click)="next(); $event.stopPropagation()"
        class="absolute right-2 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full bg-surface-900/60 text-xl text-white hover:bg-surface-900/80 sm:right-6"
        aria-label="Next photo"
      >
        &rsaquo;
      </button>
    }

    <img
      [src]="photoUrls()[index]"
      [alt]="title()"
      class="max-h-full max-w-full object-contain"
      (click)="$event.stopPropagation()"
    />
  </div>
}
