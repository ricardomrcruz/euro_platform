<div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
  <h1 class="text-2xl font-bold text-white">{{ 'auctions.heading' | translate }}</h1>

  @if (loading()) {
    <p class="mt-4 text-sm text-surface-300">...</p>
  } @else if (auctions().length === 0) {
    <p class="mt-4 text-sm text-surface-300">{{ 'auctions.empty' | translate }}</p>
  } @else {
    <div class="mt-6 grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-4">
      @for (auction of auctions(); track auction.id) {
        <app-auction-card [data]="auction" />
      }
    </div>
  }
</div>
